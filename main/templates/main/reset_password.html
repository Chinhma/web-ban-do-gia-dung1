{% extends 'main/layout.html' %}

{% block content %}
<div style="max-width:460px;margin:40px auto;padding:24px;background:white;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,0.08)">
  <h2>Đặt mật khẩu mới</h2>
  {% if error %}
  <div style="color:#c00;margin-bottom:12px">{{ error }}</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <input name="password" type="password" placeholder="Mật khẩu mới" style="width:100%;padding:10px;margin-bottom:12px;border:1px solid #ddd;border-radius:6px" required />
    <input name="confirm" type="password" placeholder="Nhập lại mật khẩu" style="width:100%;padding:10px;margin-bottom:12px;border:1px solid #ddd;border-radius:6px" required />
    <button type="submit" style="width:100%;padding:10px;background:#667eea;color:white;border:none;border-radius:6px">Đổi mật khẩu</button>
  </form>
</div>
{% endblock %}
